<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart</title>

<link rel="stylesheet" href="cart.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="cart-header">

    <h1>
        <i class="fa-solid fa-cart-shopping"></i>
        Shopping Cart
    </h1>

    <a href="homepage.html" class="continue">
        ← Continue Shopping
    </a>

</div>

<div class="cart-page">

    <!-- Left Side -->

    <div class="cart-left">

        <div id="cart-container"></div>

    </div>

    <!-- Right Side -->

    <div class="cart-right">

        <h2>Order Summary</h2>

        <div class="summary-row">
            <span>Subtotal</span>
            <span id="subtotal">₹0</span>
        </div>

        <div class="summary-row">
            <span>Shipping</span>
            <span>FREE</span>
        </div>

        <div class="summary-row">
            <span>Discount</span>
            <span style="color:green;">-₹50</span>
        </div>

        <hr>

        <div class="summary-row total">
            <span>Total</span>
            <span id="total">₹0</span>
        </div>

        <input type="text"
        placeholder="Enter Coupon Code">

        <button class="coupon-btn">
            Apply Coupon
        </button>

       <button class="checkout-btn" onclick="checkout()">
    <i class="fa-solid fa-lock"></i>
    Proceed to Checkout
</button>

        <div class="services">

            <p>
                <i class="fa-solid fa-truck-fast"></i>
                Free Delivery
            </p>

            <p>
                <i class="fa-solid fa-shield-heart"></i>
                Secure Payment
            </p>

            <p>
                <i class="fa-solid fa-rotate-left"></i>
                Easy Returns
            </p>

        </div>

    </div>

</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let container = document.getElementById("cart-container");

let total = 0;

if(cart.length==0)
{
    container.innerHTML=`
    <div class="empty-cart">
        <i class="fa-solid fa-cart-shopping"></i>
        <h2>Your Cart is Empty</h2>
        <p>Add your favourite crochet products.</p>
    </div>`;
}
else
{
    cart.forEach(function(item,index){

        total += Number(item.price.replace("₹",""));

        container.innerHTML +=`

        <div class="cart-item">

            <img src="${item.image}">

            <div class="details">

                <h2>${item.name}</h2>

                <p>${item.description}</p>

                <h3>${item.price}</h3>

                <button class="remove-btn"
                onclick="removeItem(${index})">

                <i class="fa-solid fa-trash"></i>
                Remove

                </button>

            </div>

        </div>

        `;

    });

    document.getElementById("subtotal").innerHTML="₹"+total;

    document.getElementById("total").innerHTML="₹"+(total-50);

}

function removeItem(index)
{
    cart.splice(index,1);

    localStorage.setItem("cart",JSON.stringify(cart));

    location.reload();
}
function checkout()
{
    if(cart.length == 0)
    {
        alert("Your cart is empty!");
        return;
    }

    localStorage.setItem("checkoutItems", JSON.stringify(cart));

    window.location.href = "buynow.html";
}
</script>
</body>

</html>
