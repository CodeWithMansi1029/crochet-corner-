<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buy Now</title>

<link rel="stylesheet" href="buynow.css">

<link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="cart-header">

    <h1>
       Chrochet Corner
    </h1>

    <a href="homepage.html" class="continue">
        ← Continue Shopping
    </a>

</div>


<h2 class="title">Buy Now</h2>

<div class="main">

    <div id="productDetails">

    </div>

    <div class="details">

        <h3>Delivery Details</h3>

        <input type="text" id="name" placeholder="Enter Full Name">

        <input type="text" id="phone" placeholder="Enter Mobile Number">

        <textarea id="address" placeholder="Enter Delivery Address"></textarea>

        <select id="payment">

            <option>Select Payment Method</option>

            <option>Cash on Delivery</option>

            <option>UPI</option>

            <option>Credit Card</option>

            <option>Debit Card</option>

        </select>

<button onclick="placeOrder()">Place Order</button>
    </div>

</div>

<script src="buynow.js"></script>

</body>
</html>
